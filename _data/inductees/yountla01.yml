title: "The Null Value"
blurb: |
  September 15, 1971: the Astros summon the 21-year-old to pitch the ninth
  against Atlanta. Once announced, he is officially in the game — and during his
  warmup tosses, his elbow gives out. He leaves without facing a batter and never
  makes it back. The books credit him with one game and nothing else: zero
  innings, zero batters, zero pitches — an ERA of 0 over 0, mathematically undefined.
  Kid brother
  <a href="https://www.baseball-reference.com/players/y/yountro01.shtml" target="_blank" rel="noopener">Robin</a>
  collected 3,142 hits and a plaque in Cooperstown. The Younts
  played 2,857 big-league games; exactly one of them is empty.
