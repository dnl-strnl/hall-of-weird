title: "The Designated Runner"
blurb: |
  A <a href="https://sabr.org/journal/article/designated-runner-herb-washington/" target="_blank" rel="noopener">world-record
  sprinter</a> who had not played baseball since high school, signed by
  <a href="https://sabr.org/bioproj/person/charlie-finley/" target="_blank" rel="noopener">Charlie
  Finley</a> purely to run. 105 games, 33 runs, 31 steals — and he never once stood in
  the batter's box or took the field. His 1975 Topps card lists his position as
  "Pinch Run." No other card in history says that. He was also thrown out seventeen
  times in forty-eight attempts — including a pickoff by <a href="https://www.baseball-reference.com/players/m/marshmi01.shtml" target="_blank" rel="noopener">Mike
  Marshall</a> in Game Two of the World Series, caught leaning the wrong way in the one
  job he had — and collected a full Series share of $22,210 without taking a swing.
