title: "The Winless Wonder"
blurb: |
  The most career losses without ever recording a win. Sixteen decisions, sixteen
  defeats — and somehow three saves along the way, meaning he preserved wins for
  everyone but himself. His stuff wasn't even bad: nearly a strikeout per two innings.
  Baseball simply, categorically, refused to let him win. He was out of the majors at 24.
